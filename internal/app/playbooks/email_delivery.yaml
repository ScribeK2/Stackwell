# Email Delivery: "mail isn't arriving" or "mail is bouncing".
# The domain's mail records and authentication, then its main mail server.
name: email_delivery
label: Email Delivery
description: Mail records and authentication, blocklist status of the domain and all its mail servers, and the primary mail server's ports.
kinds: [domain]
entries:
  - id: dns
    check: dns_lookup
  - check: email_auth
  - id: mx_ports
    check: hosting_reachability
    depends_on: dns
    target: primary_mx_host
    options: {depth: quick}
  # On the domain, not the primary MX host: that covers the domain-based
  # lists plus every mail server's addresses, backups included.
  - check: blacklist
boundary:
  - "Individual messages: whether a specific message was accepted, deferred or filtered is only in the sending and receiving servers' logs. Paste them into the Case as Evidence."
  - "Recipient-side filtering: spam scoring and quarantine at the receiving provider aren't visible from outside."
  - "Mail server internals: queues, account limits and authentication failures for a mailbox are only visible to the mail provider."
