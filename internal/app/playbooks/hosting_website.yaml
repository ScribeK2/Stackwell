# Hosting & Website: "the site is down", "the site is slow" or certificate errors.
name: hosting_website
label: Hosting & Website
description: DNS, server reachability, the website's response and its TLS certificate.
kinds: [domain, hostname]
entries:
  - check: dns_lookup
  - check: hosting_reachability
    options: {depth: quick}
  - check: website_inspection
  - check: ssl_inspection
boundary:
  - "Inside the hosting account: application errors, PHP and plugin state, and server configuration are only visible on the host or in its control panel."
  - "Behind a CDN or proxy: if the site sits behind one, these Checks see the edge, not the origin server."
  - "Server-side logs: why a request failed (500s, timeouts) is recorded in the web server's error log, not in what it sends back."
