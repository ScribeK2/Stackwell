# Orientation: the first look at a domain on any new ticket.
# Who it's registered with, how it resolves, and what its server answers.
name: orientation
label: Orientation
description: Registration, DNS and server reachability for a domain.
kinds: [domain]
entries:
  - check: registration
  - check: dns_lookup
  - check: hosting_reachability
    options: {depth: quick}
boundary:
  - "Registrar account: lookups show public registry data only. The registrant's account, registrar-level locks and pending orders aren't visible from outside."
  - "The server itself: open ports say what answers, not why something behind them fails. Application logs and configuration are only visible on the host."
